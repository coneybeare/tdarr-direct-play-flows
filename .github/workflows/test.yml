name: Validate Flows

on:
  push:
  pull_request:

jobs:
  test:
    name: Validate Flow JSON
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run flow validation tests
        run: node --test 'tests/*.mjs'
